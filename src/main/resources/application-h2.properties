# Eingebettetes H2 als Datei, damit die Daten einen Neustart ueberleben.
# AUTO_SERVER laesst ein Datenbank-Werkzeug an die laufende Anwendung.
spring.datasource.url=jdbc:h2:./data/plantify;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
