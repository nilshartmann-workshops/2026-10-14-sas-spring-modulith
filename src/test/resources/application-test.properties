# Gilt zusaetzlich zur application.properties der Anwendung, sobald das Profil
# "test" aktiv ist. Spring Boot laedt beide Dateien und laesst diese hier
# gewinnen; hier steht deshalb nur, was sich von der Anwendung unterscheidet.
#
# Tests laufen auf einer eigenen Datenbank im Speicher und lassen die Datei
# der Anwendung unberuehrt.
spring.datasource.url=jdbc:h2:mem:plantify-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
